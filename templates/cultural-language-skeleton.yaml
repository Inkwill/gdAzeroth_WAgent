      | 文明起源 |  |  |
      | 价值观 |  |  |
      | 社会结构 |  |  |

  - id: language
    title: 语言体系
    en: LANGUAGE
    description: 语言风格 / 命名规则 / 口癖
    template: |
      ## 语言体系（LANGUAGE）

      | 维度 | 设定 |
      |------|------|
      | 语言风格 |  |
      | 命名规则 |  |
      | 口癖/惯用语 |  |

  - id: customs
    title: 习俗礼仪
