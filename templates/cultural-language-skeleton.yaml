  - id: text
    title: 文化文本
    en: TEXT
    description: 谚语 / 常用语 / 敬语
    template: |
      ## 文化文本（TEXT）

      - 谚语：

      - 常用语：

      - 敬语/称呼：

  - id: terminology
    title: 术语表
